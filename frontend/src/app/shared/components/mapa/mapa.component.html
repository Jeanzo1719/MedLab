<!--

  el espacio donde Leaflet dibuja el mapa

  #contenedorMapa es el nombre con el que el componente lo encuentra. role y
  aria-label le dicen a los lectores de pantalla que es una región y cómo se llama

-->
<div
  #contenedorMapa
  class="mapa"
  role="region"
  [attr.aria-label]="descripcion()"
></div>
