<!--

  el botón de tema: sol cuando está oscuro (para pasar a claro) y luna cuando
  está claro (para pasar a oscuro). El texto para lectores de pantalla dice qué
  va a pasar al tocarlo

-->
<button
  type="button"
  class="boton-tema"
  [attr.aria-label]="tema() === 'oscuro' ? 'Activar modo claro' : 'Activar modo oscuro'"
  (click)="alternar()"
>
  <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
    @if (tema() === "oscuro") {
      <circle cx="12" cy="12" r="4" />
      <path
        d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
      />
    } @else {
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
    }
  </svg>
</button>
