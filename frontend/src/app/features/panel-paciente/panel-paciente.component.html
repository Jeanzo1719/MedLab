<header class="barra">
  <a class="marca" routerLink="/">MedLab</a>
  <span class="rol">Panel del paciente</span>
  <app-boton-tema />
  <button type="button" class="boton-salir" (click)="cerrarSesion()">Cerrar sesión</button>
</header>

<main class="tablero">
  <div class="mapa" aria-label="Mapa de farmacias aprobadas">
    <app-mapa
      [farmacias]="farmaciasVisibles()"
      descripcion="Mapa de farmacias aprobadas con medicamentos reportados"
    />
  </div>

  <app-buscador-paciente
    class="buscador"
    (seleccionar)="seleccionar($event)"
    (buscarIniciado)="cerrarDetalle()"
  />

  @if (seleccionado(); as medicamentoId) {
    <app-detalle-medicamento
      class="detalle"
      [medicamentoId]="medicamentoId"
      (cerrar)="cerrarDetalle()"
      (seleccionar)="seleccionar($event)"
      (farmaciasReportadas)="actualizarFarmaciasReportadas($event)"
    />
  }

  <p class="contador-farmacias">
    {{ farmaciasVisibles().length }}
    {{ farmaciasVisibles().length === 1 ? "farmacia en el mapa" : "farmacias en el mapa" }}
  </p>
</main>
