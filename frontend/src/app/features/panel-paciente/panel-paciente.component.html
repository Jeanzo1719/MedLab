<header class="barra">
  <a class="marca" routerLink="/">MedLab</a>
  <span class="rol">Panel del paciente</span>
  <app-boton-tema />
  <button type="button" class="boton-salir" (click)="cerrarSesion()">Cerrar sesión</button>
</header>

<main class="contenido">
  @let actual = sesion();
  <h1>Hola{{ actual ? ", " + actual.identificacion : "" }}</h1>
  <p class="introduccion">
    Busca el medicamento que necesitas, consulta qué farmacia cerca de ti lo tiene y cuéntanos
    qué encontraste.
  </p>

  <app-buscador-medicamentos />
</main>
