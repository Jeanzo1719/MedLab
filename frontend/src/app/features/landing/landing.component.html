<!--
  Plantilla de la landing pública.
  Arma la página con el encabezado fijo, las tres secciones dentro de <main>
  (inicio, servicios, contacto) y el pie de página. Solo la sección de inicio
  recibe datos: los marcadores del mapa que prepara LandingComponent.
-->
<app-encabezado />

<main>
  <app-seccion-inicio [marcadores]="marcadores()" />
  <app-seccion-servicios />
  <app-seccion-contacto />
</main>

<app-pie-pagina />
