<!--

  la sección de inicio. id="inicio" es a donde salta el menú y
  aria-labelledby le dice al lector de pantalla que su nombre es el título

-->
<section id="inicio" class="inicio" aria-labelledby="titulo-inicio">
  <div class="contenido">
    <!--

      el título principal de la página (el único h1), la descripción y el buscador

    -->
    <div class="presentacion">
      <h1 id="titulo-inicio">Encuentra tus medicamentos en farmacias cercanas</h1>
      <p class="descripcion">
        Consulta en qué farmacias de Medellín hay disponibilidad, compara precios
        y ayuda a otros reportando lo que encuentras.
      </p>

      <app-buscador-medicamentos />
    </div>

    <!--

      el mapa con las farmacias aprobadas. descripcion es lo que lee el lector
      de pantalla para describirlo

    -->
    <div class="mapa">
      <app-mapa
        [marcadores]="marcadores()"
        descripcion="Mapa de farmacias aprobadas en Medellín"
      />
    </div>
  </div>
</section>
