<!--

  el pie de página, con fondo oscuro

-->
<footer class="pie">
  <div class="contenido">
    <!--

      el logo en su versión para fondo oscuro y el nombre MedLab. loading="lazy"
      hace que la imagen se cargue solo cuando el usuario llega al final de la página

    -->
    <div class="marca">
      <img
        src="assets/images/marca/medlab-icono-oscuro.svg"
        alt=""
        width="36"
        height="36"
        loading="lazy"
      />
      <span class="nombre">MedLab</span>
    </div>
    <!--

      una frase corta que resume qué es MedLab

    -->
    <p class="lema">
      Disponibilidad de medicamentos en farmacias cercanas, reportada por la
      comunidad.
    </p>

    <!--

      los enlaces a las secciones, igual que en el encabezado. aria-label los
      distingue del menú de arriba para el lector de pantalla

    -->
    <nav aria-label="Secciones de la página (pie de página)">
      <ul>
        @for (seccion of secciones; track seccion.id) {
          <li>
            <a routerLink="/" [fragment]="seccion.id">{{ seccion.etiqueta }}</a>
          </li>
        }
      </ul>
    </nav>

    <!--

      los derechos reservados con el año actual

    -->
    <p class="derechos">© {{ anioActual }} MedLab. Todos los derechos reservados.</p>
  </div>
</footer>
