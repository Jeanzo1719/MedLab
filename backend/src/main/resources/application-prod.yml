# Perfil de producción. Todo viene de variables de entorno que define docker/prod-docker-compose.yml;
# no hay valores por defecto a propósito: si falta una, el arranque debe fallar.
spring:
  datasource:
    url: jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  cors:
    allowed-origins: ${SPRING_CORS_ALLOWED_ORIGINS}

  jpa:
    hibernate:
      ddl-auto: validate

medlab:
  jwt:
    secret: ${MEDLAB_JWT_SECRET}
