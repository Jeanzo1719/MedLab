spring:
  application:
    name: medlab

  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:medlab-database}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
      show_sql: 
      highlight_sql:

  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true

  server:
    port: ${SERVER_PORT:8080}
    address: ${SERVER_ADDRESS:127.0.0.1}

cors:
  origenes-permitidos: ${CORS_ORIGENES_PERMITIDOS:http://localhost:1420,tauri://localhost,http://tauri.localhost}
