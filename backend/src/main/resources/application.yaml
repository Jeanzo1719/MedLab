spring:
  application:
    name: medlab

  ## connection values come from the environment (.env file through docker compose);
  ## defaults point to a local MariaDB for development outside Docker
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:medlab-database}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
      show_sql:
      highlight_sql:

  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true

## server is a root-level key, not part of spring
server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}
