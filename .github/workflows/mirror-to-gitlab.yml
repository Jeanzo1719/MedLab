name: Mirror to GitLab

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-24.04

    steps:
      - name: Mirror repository to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git clone --mirror \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            repository.git

          cd repository.git

          git push --mirror \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.com/Jeanzo1719/medlab.git"
